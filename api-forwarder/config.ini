; ============================================================
; ClaudeCodeBridge 配置文件（forwarder.js / proxy.js 共用）
;
; 注释以 ; 或 # 开头。修改后重启脚本生效。
; 同名环境变量（LISTEN_PORT / PROXY_PORT / PROXY_ALLOW 等）优先级更高，
; 便于临时覆盖而不改文件。
; ============================================================

[network]
; 本机（运行本仓库脚本）的内网 IP。TARGET 上的配置应指向该地址。
LOCAL_IP=10.40.111.234

; TARGET 客户端的内网 IP。仅该地址可访问 8634 / 8633。
TARGET_IP=10.40.62.6

[forwarder]
; API 转发器（forwarder.js）：监听地址/端口 -> 本机 Vibe 的 api-worker
; 8634 已在防火墙既有规则中放行
LISTEN_HOST=0.0.0.0
LISTEN_PORT=8634
; 转发目标（本机 api-worker，一般无需修改）
UPSTREAM_HOST=127.0.0.1
UPSTREAM_PORT=9182

[proxy]
; 统一代理（proxy.js）：同一端口同时支持 HTTP CONNECT 与 SOCKS5
; 8633 已在防火墙既有规则中放行
LISTEN_HOST=0.0.0.0
LISTEN_PORT=8633
; 允许访问代理的源 IP，逗号分隔
; TARGET_IP 会自动加入；* 表示放行全部（不建议）
ALLOW_IPS=127.0.0.1,::1,10.40.62.6

[log]
; 是否输出连接日志（true/false）
ENABLED=true
